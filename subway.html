<style>
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(ellipse at top,#14163a 0%,#080913 70%);color:#fff;overflow-x:hidden;min-height:100vh}

</style>

<body>
<header>
  <h1>Subway Blocks</h1>
  <p>Learn the rifts, dodge obstacles, and grab the gold!</p>
</header>
<div class="wrapper">
  <div class="panel">
    <button onclick="startGame(true)">Restart</button>
    <button onclick="window.location.href='index.html'">Back</button>
    <label class="color-label">
      Color:
      <input type="color" id="colorPicker" value="#4c6fff"
        onfocus="paused = true"
        onblur="paused = false">
    </label>
  </div>

  <div class="canvas-container">
    <canvas id="game" width="500" height="500"></canvas>

    <div id="tutorial-banner" class="tutorial-banner">
      <div id="tut-title" class="tut-title">Tutorial</div>
      <div id="tut-desc" class="tut-desc">Learn the controls!</div>
      <div id="tut-action" class="tut-action">PRESS KEY</div>
    </div>

    <div class="hud-overlay">
      <div class="hud-box">
        <span class="hud-label">SCORE</span>
        <span id="score-val" class="hud-value">000000</span>
      </div>
      <div class="hud-box multiplier">
        <span class="hud-label">MULTIPLIER</span>
        <span id="mult-val" class="hud-value">x1</span>
      </div>
      <div class="hud-box bars">
        <span class="hud-label">GOLD BARS</span>
        <span id="bars-val" class="hud-value">0000</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    <strong>Controls:</strong> Arrow keys or WASD.<br>
    <strong>⬅️ ➡️ / A D</strong> - Switch Lanes | <strong>⬆️ / W / Space</strong> - Jump | <strong>⬇️ / S</strong> - Slide
  </div>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 500, H = 500;
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = W + "px"; canvas.style.height = H + "px";

let player, obstacles, goldBars, score, multiplier, barsCollected, gameSpeed, frame, loop;
let paused = false, lastSpawnFrame = 0;
let inTutorial = false, tutorialStep = 0;
let dead = false, deadTimer = 0, dist = 0, parts = [];

const baseLanes = [80, 250, 420];      // logical lane positions (player.currentX)
const LANE_X = [-2.4, 0, 2.4];         // world-space lane positions
const OFS = 1.8;                       // world offset so visuals meet the hitbox
const depthOf = z => (0.82 - z) * 70; // game z -> world distance ahead of player

/* ================= Tiny 3D engine (Canvas 2D, no libraries) ================= */
const C = h => [h >> 16 & 255, h >> 8 & 255, h & 255];
const FOG = [8, 10, 24];
const LV = (() => { const v = [.35, .85, -.4], m = Math.hypot(...v); return v.map(a => a / m); })();
const RB = C(0x4c6fff), RP = C(0x9b5cff);
const cam = { x: 0, y: 4.3, z: -7.2, f: 430, cy: 236 };
const cp = Math.cos(.27), sp = Math.sin(.27);
let Lr = [[], [], []], glows = [];

function P(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const y2 = dy * cp + dz * sp, z2 = dz * cp - dy * sp, s = cam.f / z2;
  return [W / 2 + dx * s, cam.cy - y2 * s, z2];
}
function sh(c, l, e, z2, a) {
  if (e) l = Math.max(l, e);
  const f = Math.min(1, Math.max(0, (z2 - 12) / 58)), am = 1 - l;
  const r = [0, 1, 2].map(i => Math.round((c[i] * l + [6, 8, 22][i] * am) * (1 - f) + FOG[i] * f));
  return a < 1 ? `rgba(${r},${a})` : `rgb(${r})`;
}
// add a flat polygon (world-space points) to a layer
function qd(layer, pts, c, l, e, key, a = 1, glow) {
  const pp = [];
  let zs = 0, mnx = 1e9, mxx = -1e9;
  for (const p of pts) {
    const q = P(p[0], p[1], p[2]);
    if (q[2] < .4) return;
    pp.push(q); zs += q[2]; mnx = Math.min(mnx, q[0]); mxx = Math.max(mxx, q[0]);
  }
  if (mnx > W + 60 || mxx < -60) return;
  const z2 = zs / pp.length;
  const f = { k: key === undefined ? z2 : key, p: pp, s: sh(c, l, e, z2, a), a: a < 1 };
  Lr[layer].push(f);
  if (glow) { const ff = Math.max(0, 1 - (z2 - 12) / 58); f.g = `rgba(${c},${.16 * ff})`; glows.push(f); }
}
// oriented box: x,z centre, y bottom. e = emissive level, rot = yaw, kb = depth bias, g = neon glow
function box(x, y, z, w, h, d, c, e = 0, rot = 0, kb = 0, g = 0) {
  const hw = w / 2, hd = d / 2, cy = y + h / 2, cs = [];
  for (let i = 0; i < 8; i++) {
    let lx = i & 1 ? hw : -hw, ly = i & 2 ? h / 2 : -h / 2, lz = i & 4 ? hd : -hd;
    if (rot) { const cr = Math.cos(rot), sr = Math.sin(rot); [lx, lz] = [lx * cr + lz * sr, -lx * sr + lz * cr]; }
    cs.push([x + lx, cy + ly, z + lz]);
  }
  const key = P(x, cy, z)[2] + kb;
  for (const F of [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]]) {
    const q = F.map(i => cs[i]);
    const fx = (q[0][0] + q[2][0]) / 2, fy = (q[0][1] + q[2][1]) / 2, fz = (q[0][2] + q[2][2]) / 2;
    let nx = fx - x, ny = fy - cy, nz = fz - z; const m = Math.hypot(nx, ny, nz) || 1;
    nx /= m; ny /= m; nz /= m;
    if (nx * (cam.x - fx) + ny * (cam.y - fy) + nz * (cam.z - fz) <= 0) continue;
    qd(2, q, c, .36 + .64 * Math.max(0, nx * LV[0] + ny * LV[1] + nz * LV[2]), e, key, 1, g);
  }
}
// static scenery uses layer 0/1 with the same box logic
function boxL(layer, ...a) { const o = Lr[2]; Lr[2] = Lr[layer]; box(...a); Lr[2] = o; }
function gq(x0, x1, z0, z1, y, c, a, layer, key, l = .8, e = 0) {
  qd(layer, [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], c, l, e, key, a);
}
function pool(x, z, rx, rz, c, a, key, layer = 1) {
  const pts = [];
  for (let i = 0; i < 10; i++) pts.push([x + Math.cos(i * .628) * rx, .03, z + Math.sin(i * .628) * rz]);
  qd(layer, pts, c, 1, 1, key, a);
}

/* ================= Scenery ================= */
let dust = [];
for (let i = 0; i < 36; i++) dust.push({ x: (Math.random() - .5) * 16, y: .2 + Math.random() * 6, z: -3 + Math.random() * 80 });

function environment() {
  const sp10 = dist % 10, base = Math.floor(dist / 10);
  gq(-8.6, 8.6, -6, 80, 0, C(0x0d0e1f), 1, 0, 999);
  for (const lx of LANE_X) gq(lx - 1.15, lx + 1.15, -6, 80, .01, C(0x181b36), 1, 0, 998);
  for (const s of [-1, 1]) {
    boxL(0, s * 7, 0, 37, 3.2, .5, 86, C(0x1a1c33));                    // platforms
    boxL(0, s * 5.45, .5, 37, .12, .03, 86, RB, 1);                      // platform edge light
    boxL(0, s * 8.7, 3.5, 36, .2, 7, 84, C(0x0f1229));                   // walls
  }
  boxL(0, 0, 7.2, 36, 18, .4, 84, C(0x0b0d20));                          // ceiling
  // rails + sleepers
  for (const lx of LANE_X) {
    for (const s of [-.6, .6]) {
      box(lx + s, 0, 38, .14, .16, 84, C(0x8a93b4), .15, 0, 500);
      box(lx + s, .16, 38, .05, .02, 84, C(0xe4eaff), 1, 0, 499);
    }
    const o = dist % 1.4;
    for (let j = 0; j < 60; j++) {
      const z = j * 1.4 - o - 5;
      gq(lx - .95, lx + .95, z, z + .4, .04, C(j % 2 ? 0x2a2433 : 0x221e2c), 1, 1, z + 100, .8);
    }
  }
  // ribs, lights, signs
  for (let k = 0; k < 9; k++) {
    const z = k * 10 - sp10 - 3, idx = base + k, col = idx & 1 ? RB : RP;
    for (const s of [-1, 1]) {
      box(s * 8.3, 0, z, .6, 7, .8, C(0x1c2038));
      box(s * 8.45, 2.6, z + 5, .12, .14, 7.5, col, 1, 0, -1, 1);
      if (idx % 3 === 0 && (idx / 3 & 1 ? s > 0 : s < 0)) {
        box(s * 8.35, 3.8, z + 2, .1, 1.4, 3.2, C(0x090b1b), 0, 0, -1);
        box(s * 8.28, 4.5, z + 2, .08, .08, 3.2, col, 1, 0, -2, 1);
        box(s * 8.28, 3.7, z + 2, .08, .08, 3.2, col, 1, 0, -2);
        for (let i = 0; i < 3; i++) box(s * 8.28, 3.9 + i * .22, z + 2 + (i - 1) * .3, .06, .1, 1.1 + (i & 1) * .6, col, .8, 0, -2);
      }
    }
    box(0, 6.9, z, 17, .5, .8, C(0x1c2038));
    box(0, 6.72, z + 5, 2.6, .1, .4, C(0xcfdcff), 1, 0, -1, 1);
    pool(0, z + 5, 4.5, 3.5, col, .07, z + 5 + 50);
  }
  // drifting dust motes
  const spd = gameSpeed * 70;
  for (const d of dust) {
    if (!dead) d.z -= spd;
    if (d.z < -3) { d.z = 78; d.x = (Math.random() - .5) * 16; d.y = .2 + Math.random() * 6; }
    const q = P(d.x, d.y, d.z);
    if (q[2] < .5) continue;
    const r = Math.max(.6, .05 * cam.f / q[2]);
    Lr[2].push({ k: q[2], p: [[q[0] - r, q[1] - r], [q[0] + r, q[1] - r], [q[0] + r, q[1] + r], [q[0] - r, q[1] + r]], s: sh(RB, 1, 1, q[2], .45), a: true });
  }
}

/* ================= Models ================= */
function hurdle(x, D) {
  const z = D - OFS, k = P(x, 1, z)[2];
  pool(x, z, 1.5, .8, C(0), .35, k + 60);
  for (const s of [-1.05, 1.05]) { box(x + s, 0, z, .18, 1.3, .18, C(0x2b2f45)); box(x + s, 1.3, z, .14, .12, .14, C(0xffb347), 1, 0, -.3, 1); }
  for (let i = 0; i < 4; i++) box(x - .75 + i * .5, .5, z, .5, .4, .22, i & 1 ? C(0x15161f) : C(0xff7a1a), 0, 0, -.2);
}
function laser(x, D, t) {
  const z = D - OFS, k = P(x, 1.5, z)[2];
  pool(x, z, 1.6, .9, RB, .12, k + 60);
  for (const s of [-1.15, 1.15]) { box(x + s, 0, z, .35, 3, .35, C(0x2a3047)); box(x + s, 3, z, .3, .1, .3, RP, 1, 0, -.3, 1); }
  const w = Math.sin(t * .15) * .02;
  qd(2, [[x - 1, 1.1, z], [x + 1, 1.1, z], [x + 1, 1.55, z], [x - 1, 1.55, z]], RB, 1, 1, k - .4, .16);
  box(x, 1.25 + w, z, 2, .1, .1, RB, 1, 0, -.6, 1);
  box(x, 1.5 - w, z, 2, .05, .05, RP, 1, 0, -.7, 1);
}
function train(x, D) {
  const z0 = D - OFS, zc = z0 + 3.5, k = P(x, 1.95, zc)[2], zf = z0 - .02;
  pool(x, zc, 1.3, 4.5, C(0), .35, k + 60);
  pool(x, z0 - 3, 1.4, 3.5, C(0xfff2c4), .1, k + 59);
  box(x, .25, zc, 2, 3.4, 7, C(0x394261), .05);
  box(x, 3.65, zc, 1.7, .18, 6.8, C(0x5a6585), .1, 0, -.2);
  box(x, 1.55, zc, 2.03, .16, 7.03, RB, 1, 0, -.4, 1);
  box(x, .25, zc, 2.03, .2, 7.03, RP, .9, 0, -.4);
  qd(2, [[x - .8, 2, zf], [x + .8, 2, zf], [x + .8, 3.2, zf], [x - .8, 3.2, zf]], C(0x0a1230), .9, 0, k - .6);
  qd(2, [[x - .8, 2, zf], [x - .2, 2, zf], [x + .2, 3.2, zf], [x - .4, 3.2, zf]], C(0x6f8bff), 1, .5, k - .7, .35);
  for (const s of [-.6, .6]) qd(2, [[x + s - .18, .7, zf], [x + s + .18, .7, zf], [x + s + .18, 1, zf], [x + s - .18, 1, zf]], C(0xfff2c4), 1, 1, k - .7, 1, 1);
  if (Math.abs(cam.x - x) > 1.05) {
    const xs = x + (cam.x < x ? -1.02 : 1.02);
    for (let j = 0; j < 4; j++) { const z = z0 + 1 + j * 1.6; qd(2, [[xs, 2, z], [xs, 2, z + 1.1], [xs, 3, z + 1.1], [xs, 3, z]], C(0x86a0ff), 1, .85, k - .5); }
  }
}
function gold(bar) {
  const x = LANE_X[bar.lane], z = depthOf(bar.z) - OFS, sp = frame * .07 + bar.lane;
  const y = .75 + Math.sin(frame * .1 + bar.lane * 2) * .12;
  pool(x, z, .6, .4, C(0), .3, P(x, 1, z)[2] + 60);
  box(x, y, z, .9, .3, .5, C(0xd9a400), .25, sp);
  box(x, y + .3, z, .6, .04, .3, C(0xfff3b0), .7 + .3 * Math.sin(sp * 2), sp, -.3);
}
function playerModel() {
  const pc = C(parseInt(document.getElementById("colorPicker").value.slice(1), 16));
  const dk = pc.map(v => v * .55), lt = pc.map(v => Math.min(255, v * 1.2 + 25));
  const x = (player.currentX - 250) / 170 * 2.4, y = -player.yOffset * .031;
  const air = player.isJumping, sw = air ? .15 : Math.sin(frame * .5) * .28;
  pool(x, 0, .8, .8, pc, .16, 120);
  pool(x + .1, .1, .6, .5, C(0), .35, 121);
  if (player.isSliding) {
    box(x, y + .05, 0, .9, .55, 1.2, pc);
    box(x, y + .15, .75, .6, .45, .5, lt);
    box(x, y + .15, .99, .46, .12, .04, C(0xdfe8ff), 1, 0, -.3);
    box(x, y + .2, -.62, .55, .4, .1, C(0x15172b), 0, 0, -.2);
    box(x, y + .3, -.68, .26, .22, .04, RP, 1, 0, -.4, 1);
    return;
  }
  for (const s of [-1, 1]) {
    box(x + s * .22, y, sw * s, .3, .65, .3, dk);
    box(x + s * .62, y + .65, -sw * s * .8, .22, .6, .24, pc.map(v => v * .8));
  }
  box(x, y + .6, 0, .9, .95, .55, pc);
  box(x, y + .75, -.4, .62, .65, .26, C(0x15172b), 0, 0, -.1);
  box(x, y + .85, -.55, .4, .4, .04, RB, 1, 0, -.3, 1);
  box(x, y + .93, -.575, .22, .22, .04, RP, 1, 0, -.5, 1);
  box(x, y + 1.55, 0, .72, .58, .62, lt);
  box(x, y + 1.7, .32, .5, .16, .04, C(0xdfe8ff), 1, 0, -.3);
  box(x, y + 2.13, 0, .08, .3, .08, RB, 1, 0, -.1);
  box(x, y + 2.43, 0, .14, .1, .14, RP, 1, 0, -.2, 1);
}

/* ================= Effects ================= */
function burst(x, y, z, n, cols, spd, sz) {
  for (let i = 0; i < n; i++) parts.push({ x, y, z, vx: (Math.random() - .5) * spd, vy: Math.random() * spd * .9, vz: (Math.random() - .5) * spd, l: 28 + Math.random() * 16, m: 44, c: cols[i % cols.length], s: sz });
}
function stepParts() {
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.z += p.vz - gameSpeed * 40; p.vy -= .014; p.l--;
    if (p.y < .05) { p.y = .05; p.vy *= -.4; }
  }
  parts = parts.filter(p => p.l > 0);
}

/* ================= Render ================= */
let vig;
function render() {
  const px = (player.currentX - 250) / 170 * 2.4;
  cam.x += (px * .4 - cam.x) * .1;
  cam.y = 4.3 + (-player.yOffset * .031) * .25 + Math.sin(frame * .25) * .02;
  cam.f = 430 + (gameSpeed - .012) * 3000;
  Lr = [[], [], []]; glows = [];
  environment();
  for (const o of obstacles) {
    const D = depthOf(o.z), x = LANE_X[o.lane];
    if (D < -6) continue;
    if (o.type === "hurdle") hurdle(x, D); else if (o.type === "laser") laser(x, D, frame); else train(x, D);
  }
  for (const b of goldBars) if (!b.collected) gold(b);
  if (!dead) playerModel();
  for (const p of parts) {
    const q = P(p.x, p.y, p.z); if (q[2] < .5) continue;
    const r = p.s * cam.f / q[2], a = Math.min(1, p.l / 14);
    Lr[2].push({ k: q[2] - .5, p: [[q[0] - r, q[1] - r], [q[0] + r, q[1] - r], [q[0] + r, q[1] + r], [q[0] - r, q[1] + r]], s: sh(p.c, 1, 1, q[2], a), a: true });
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#080a18"; ctx.fillRect(0, 0, W, H);
  const end = P(0, 3, 78), g = ctx.createRadialGradient(end[0], end[1], 0, end[0], end[1], 170);
  g.addColorStop(0, "rgba(155,92,255,.55)"); g.addColorStop(.4, "rgba(76,111,255,.2)"); g.addColorStop(1, "rgba(8,10,24,0)");
  ctx.save();
  const roll = (player.currentX - baseLanes[player.targetLane]) / 170 * -.035;
  const shk = dead ? deadTimer * .25 : 0;
  ctx.translate(W / 2 + (Math.random() - .5) * shk, H / 2 + (Math.random() - .5) * shk);
  ctx.rotate(roll); ctx.scale(1.04, 1.04); ctx.translate(-W / 2, -H / 2);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.lineWidth = .7; ctx.lineJoin = "round";
  for (const L of Lr) {
    L.sort((a, b) => b.k - a.k);
    for (const f of L) {
      ctx.fillStyle = f.s; ctx.beginPath();
      const p = f.p; ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.closePath(); ctx.fill();
      if (!f.a) { ctx.strokeStyle = f.s; ctx.stroke(); }
    }
  }
  ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 5;
  for (const f of glows) {
    ctx.strokeStyle = f.g; ctx.beginPath();
    ctx.moveTo(f.p[0][0], f.p[0][1]);
    for (let i = 1; i < f.p.length; i++) ctx.lineTo(f.p[i][0], f.p[i][1]);
    ctx.closePath(); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
  if (!vig) { vig = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 360); vig.addColorStop(0, "rgba(5,6,16,0)"); vig.addColorStop(1, "rgba(5,6,16,.6)"); }
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  if (dead && deadTimer > 20) { ctx.fillStyle = `rgba(255,50,90,${(deadTimer - 20) / 20 * .35})`; ctx.fillRect(0, 0, W, H); }
}

/* ================= Game logic (unchanged behaviour) ================= */
function init() {
  player = { targetLane: 1, currentX: 250, yOffset: 0, gravity: 0.6, jumpVelocity: 0, isJumping: false, isSliding: false, slideTimer: 0 };
  obstacles = []; goldBars = []; parts = [];
  score = 0; multiplier = 1; barsCollected = 0; gameSpeed = 0.012; frame = 0;
  paused = false; dead = false; deadTimer = 0; dist = 0;
}

function startTutorial() {
  init();
  inTutorial = true;
  tutorialStep = 1;
  showTutorialUI();
  obstacles = [{ lane: 1, z: 0.1, type: "train", passed: false }];
  updateHUD();
  clearInterval(loop);
  loop = setInterval(update, 20);
}

function startGame(skipTutorial = false) {
  if (!skipTutorial) { startTutorial(); return; }
  init();
  inTutorial = false;
  hideTutorialUI();
  lastSpawnFrame = -100;
  updateHUD();
  clearInterval(loop);
  loop = setInterval(update, 20);
}

function showTutorialUI() {
  const banner = document.getElementById("tutorial-banner");
  const title = document.getElementById("tut-title");
  const desc = document.getElementById("tut-desc");
  const action = document.getElementById("tut-action");
  banner.style.display = "block";
  banner.style.animation = "none"; void banner.offsetHeight; banner.style.animation = "";
  if (tutorialStep === 1) {
    title.innerText = "Step 1: Dodge Trains!";
    desc.innerText = "A massive train blocks your lane! Change lanes to avoid a crash.";
    action.innerText = "Press LEFT ⬅️ or RIGHT ➡️";
  } else if (tutorialStep === 2) {
    title.innerText = "Step 2: Jump Barriers!";
    desc.innerText = "Orange hurdles block the tracks. Leap clean over them!";
    action.innerText = "Press UP ⬆️, W, or Space";
  } else if (tutorialStep === 3) {
    title.innerText = "Step 3: Duck Lasers!";
    desc.innerText = "High neon lasers bar the way. Slide underneath them!";
    action.innerText = "Press DOWN ⬇️ or S";
  }
}

function hideTutorialUI() {
  document.getElementById("tutorial-banner").style.display = "none";
}

document.addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (paused || dead) return;
  let actionTaken = false;
  if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") && !player.isJumping && !player.isSliding) {
    player.isJumping = true;
    player.jumpVelocity = -10;
    if (inTutorial && tutorialStep === 2) actionTaken = true;
  }
  if ((e.code === "ArrowDown" || e.code === "KeyS") && !player.isJumping && !player.isSliding) {
    player.isSliding = true;
    player.slideTimer = 25;
    if (inTutorial && tutorialStep === 3) actionTaken = true;
  }
  if ((e.code === "ArrowLeft" || e.code === "KeyA") && player.targetLane > 0) {
    player.targetLane--;
    if (inTutorial && tutorialStep === 1) actionTaken = true;
  }
  if ((e.code === "ArrowRight" || e.code === "KeyD") && player.targetLane < 2) {
    player.targetLane++;
    if (inTutorial && tutorialStep === 1) actionTaken = true;
  }
  if (inTutorial && actionTaken) advanceTutorial();
});

function advanceTutorial() {
  if (tutorialStep === 1) {
    obstacles = [{ lane: player.targetLane, z: 0.1, type: "hurdle", passed: false }];
    tutorialStep = 2;
    showTutorialUI();
  } else if (tutorialStep === 2) {
    obstacles = [{ lane: player.targetLane, z: 0.1, type: "laser", passed: false }];
    tutorialStep = 3;
    showTutorialUI();
  } else if (tutorialStep === 3) {
    inTutorial = false;
    tutorialStep = 0;
    hideTutorialUI();
    score += 500;
    barsCollected += 5;
    updateHUD();
    alert("🎉 Tutorial Complete!\nNow, brace yourself for the real run!");
  }
}

function spawnObstacle() {
  if (inTutorial) return;
  if (frame - lastSpawnFrame < 30) return;
  const lane = Math.floor(Math.random() * 3);
  if (obstacles.length > 0) {
    const closeObstacles = obstacles.filter(o => o.z < 0.35);
    if (closeObstacles.length >= 2) return;
  }
  const types = ["hurdle", "laser", "train"];
  const type = types[Math.floor(Math.random() * types.length)];
  obstacles.push({ lane: lane, z: 0, type: type, passed: false });
  lastSpawnFrame = frame;
}

function spawnGoldBar() {
  if (inTutorial) return;
  const lane = Math.floor(Math.random() * 3);
  const laneOccupied = obstacles.some(o => o.lane === lane && o.z < 0.2);
  if (laneOccupied) return;
  goldBars.push({ lane: lane, z: 0, collected: false });
}

function updateHUD() {
  document.getElementById("score-val").innerText = String(Math.floor(score)).padStart(6, '0');
  document.getElementById("mult-val").innerText = `x${multiplier}`;
  document.getElementById("bars-val").innerText = String(barsCollected).padStart(4, '0');
}

function update() {
  if (paused) return;
  frame++;
  stepParts();

  if (dead) {
    if (--deadTimer <= 0) {
      clearInterval(loop);
      render();
      setTimeout(() => {
        alert("🚀 Run Finished!\nTotal Score: " + Math.floor(score) + "\nGold Bars Collected: " + barsCollected);
      }, 50);
      return;
    }
    render();
    return;
  }

  dist += gameSpeed * 70;

  if (!inTutorial) {
    score += 0.15 * multiplier;
    if (frame % 500 === 0) multiplier++;
    if (frame % 350 === 0 && gameSpeed < 0.025) gameSpeed += 0.001;
  }
  updateHUD();

  if (player.isJumping) {
    player.yOffset += player.jumpVelocity;
    player.jumpVelocity += player.gravity;
    if (player.yOffset >= 0) { player.yOffset = 0; player.isJumping = false; }
  }
  if (player.isSliding) {
    player.slideTimer--;
    if (player.slideTimer <= 0) player.isSliding = false;
  }
  const targetX = baseLanes[player.targetLane];
  player.currentX += (targetX - player.currentX) * 0.25;

  if (frame % 45 === 0 || (frame < 5 && !inTutorial)) spawnObstacle();
  if (frame % 30 === 0 || (frame < 5 && !inTutorial)) spawnGoldBar();

  for (let i = goldBars.length - 1; i >= 0; i--) {
    let bar = goldBars[i];
    bar.z += gameSpeed;
    if (!bar.collected && bar.z > 0.78 && bar.z < 0.88 && bar.lane === player.targetLane && !player.isSliding) {
      if (player.yOffset > -40) {
        bar.collected = true;
        barsCollected++;
        score += 150;
        updateHUD();
        burst(LANE_X[bar.lane], 1, depthOf(bar.z) - OFS, 16, [C(0xffd700), C(0xfff3b0), RB, RP], .14, .06);
      }
    }
  }
  goldBars = goldBars.filter(b => b.z < 1 && !b.collected);

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    if (!(inTutorial && obs.z >= 0.7)) obs.z += gameSpeed;
    if (!obs.passed && obs.z > 0.78 && obs.z < 0.86 && obs.lane === player.targetLane) {
      if (obs.type === "hurdle" && !player.isJumping) gameOver();
      else if (obs.type === "laser" && !player.isSliding) gameOver();
      else if (obs.type === "train") gameOver();
    }
    if (obs.z >= 0.86 && !obs.passed) {
      obs.passed = true;
      score += 50;
      updateHUD();
    }
  }
  obstacles = obstacles.filter(o => o.z < 1);

  render();
}

function gameOver() {
  if (dead) return;
  dead = true; deadTimer = 40;
  hideTutorialUI();
  const pc = C(parseInt(document.getElementById("colorPicker").value.slice(1), 16));
  burst((player.currentX - 250) / 170 * 2.4, 1 - player.yOffset * .031, 0, 40, [pc, C(0xffffff), C(0xff4466), RP], .3, .1);
}

startTutorial();
</script>
