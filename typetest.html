<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test - Rift Hub</title>
<style>
:root{--bg:#06070d;--text:#f1f5f9;--dim:rgba(148,163,184,.55);--muted:#94a3b8;--accent:#3b82f6;--bad:#f87171;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--lh:54px}
body.light{--bg:#eef1f7;--text:#0f172a;--dim:rgba(71,85,105,.45);--muted:#475569;--bad:#dc2626;--panel:rgba(255,255,255,.65);--line:rgba(0,0,0,.1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:radial-gradient(70% 50% at 15% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(60% 50% at 100% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
.top{width:100%;max-width:900px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:28px}
.back{justify-self:start;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;transition:color .2s}
.back:hover{color:var(--accent)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.card{width:100%;max-width:900px;border-radius:28px;padding:34px 40px 30px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.12)}
.modes{display:flex;width:max-content;margin:0 auto 26px;padding:4px;border-radius:14px;background:rgba(127,127,127,.12);gap:2px}
.modes button{border:0;background:transparent;color:var(--muted);padding:8px 22px;border-radius:10px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.modes button:hover{color:var(--text)}
.modes button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.hud{display:flex;justify-content:center;gap:56px;margin-bottom:26px}
.hud div{text-align:center;min-width:64px}
.hud b{display:block;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hud div:first-child b{color:var(--accent)}
.hud span{display:block;margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stage{position:relative;cursor:text}
.view{height:calc(var(--lh)*3);overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#words{position:relative;display:flex;flex-wrap:wrap;column-gap:.75ch;font:500 28px/var(--lh) ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:transform .18s ease,filter .2s,opacity .2s}
.word{height:var(--lh);color:var(--dim);white-space:nowrap}
.word span.ok{color:var(--text)}
.word span.bad{color:var(--bad)}
.word span.x{opacity:.85}
.word.wrong{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2px;text-underline-offset:8px}
#caret{position:absolute;width:3px;height:34px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);transition:left .09s ease,top .09s ease;pointer-events:none}
.idle #caret{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
.stage.off #words{filter:blur(6px);opacity:.5}
.focus{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.stage.off .focus{display:flex}
.focus span{padding:10px 20px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;backdrop-filter:blur(10px)}
#in{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.foot{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:16px;font-size:12.5px;color:var(--muted)}
.foot kbd{font:600 11px inherit;font-family:inherit;padding:3px 8px;border-radius:6px;background:rgba(127,127,127,.15);border:1px solid var(--line)}
.rs{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;cursor:pointer;transition:.2s}
.rs:hover{color:var(--accent);border-color:var(--accent)}
#res{display:none;text-align:center;padding:6px 0 4px}
#res .big{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent)}
#res .big small{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
#res .row{display:flex;justify-content:center;gap:14px;margin:26px 0 20px;flex-wrap:wrap}
#res .row div{min-width:130px;padding:14px 18px;border-radius:16px;background:rgba(127,127,127,.1);border:1px solid var(--line)}
#res .row b{display:block;font-size:24px}
#res .row span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#res p{margin:0 0 20px;font-size:14px;color:var(--muted)}
.again{border:0;padding:12px 30px;border-radius:12px;background:var(--accent);color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);transition:.2s}
.again:hover{transform:translateY(-1px)}
@media(max-width:620px){.card{padding:24px 18px}.hud{gap:28px}.hud b{font-size:26px}#words{font-size:21px}:root{--lh:44px}#res .big{font-size:64px}}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← Rift Hub</a><h1>Typing Test</h1><span></span></div>

<div class="card" id="card">
  <div class="modes" id="modes"><button data-t="15">15s</button><button data-t="30" class="on">30s</button><button data-t="60">60s</button></div>
  <div class="hud" id="hud">
    <div><b id="time">30</b><span>Time</span></div>
    <div><b id="wpm">0</b><span>WPM</span></div>
    <div><b id="acc">100%</b><span>Accuracy</span></div>
  </div>
  <div class="stage off idle" id="stage">
    <div class="view"><div id="words"><div id="caret"></div></div></div>
    <div class="focus"><span>Click here or press any key to focus</span></div>
  </div>
  <input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="res">
    <div class="big"><span id="rW">0</span><small>WPM</small></div>
    <div class="row">
      <div><b id="rA">100%</b><span>Accuracy</span></div>
      <div><b id="rC">0</b><span>Words correct</span></div>
      <div><b id="rB">0</b><span>Best</span></div>
    </div>
    <p id="rN"></p>
    <button class="again" id="again">Try Again</button>
  </div>
  <div class="foot" id="foot"><button class="rs" id="rs" title="Restart" aria-label="Restart">↻</button><span><kbd>Tab</kbd> or <kbd>Esc</kbd> to restart</span></div>
</div>

<script>
const ACC={dark:"#3b82f6",light:"#0066ff",crimson:"#e11d48",emerald:"#10b981",midnight:"#4f8cff",aurora:"#2dd4bf",cyber:"#00f0ff",arctic:"#0e8fb5",sunset:"#fb7a2f"};
try{const t=localStorage.getItem("riftTheme")||"dark";
  if(t==="light"||t==="arctic")document.body.classList.add("light");
  document.documentElement.style.setProperty("--accent",ACC[t]||ACC.dark);}catch(e){}

const WORDS="the be to of and a in that have it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were been has had did said each tell does set three air play small end put home read hand port large spell add land here must big high such follow act why ask men change went light kind off need house picture try again animal point mother world near build self earth father head stand own page should country found answer school grow study still learn plant cover food sun four between state keep eye never last let thought city tree cross farm hard start might story saw far sea draw left late run press close night real life few north open seem together next white children begin got walk example ease paper group always music those both mark often letter until mile river car feet care second book carry took science eat room friend began idea fish mountain stop once base hear horse cut sure watch color face wood main enough plain girl usual young ready above ever red list though feel talk bird soon body dog family direct leave song measure door product black short class wind question happen complete ship area half rock order fire south problem piece told knew pass since top whole king space heard best hour better true during hundred five remember step early hold west ground interest reach fast sing listen six table travel less morning ten simple several toward war lay against pattern slow center love person money serve appear road map rain rule govern pull cold notice voice unit power town fine certain fly fall lead cry dark machine note wait plan figure star box field rest correct able pound done beauty drive stood contain front teach week final gave green quick develop ocean warm free minute strong special mind behind clear tail produce fact street inch nothing course stay wheel full force blue object decide surface deep moon island foot system busy test record boat common gold possible plane dry wonder laugh thousand ago ran check game shape hot miss brought heat snow tire bring yes distant fill east paint language among rift portal glass pixel neon orbit comet nebula quantum vector".split(" ");

const $=id=>document.getElementById(id);
const stage=$("stage"),wordsEl=$("words"),caret=$("caret"),inp=$("in");
const LH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lh"))||54;
let dur=30,left=30,timer=null,started=false,done=false;
let words=[],els=[],wi=0,cur="",doneChars=0,totalKeys=0,goodKeys=0,okWords=0;
const bkey=()=>dur===30?"riftTypingBest":"riftTypingBest"+dur;
const getBest=()=>{try{return parseInt(localStorage.getItem(bkey()))||0}catch(e){return 0}};

function addWords(n){
  for(let i=0;i<n;i++){
    const w=WORDS[Math.floor(Math.random()*WORDS.length)];
    words.push(w);
    const d=document.createElement("div");d.className="word";
    for(const c of w){const s=document.createElement("span");s.textContent=c;d.appendChild(s)}
    wordsEl.appendChild(d);els.push(d);
  }
}
function paint(){
  const el=els[wi],w=words[wi];
  el.querySelectorAll(".x").forEach(x=>x.remove());
  [...el.children].forEach((s,i)=>{s.className=i<cur.length?(cur[i]===w[i]?"ok":"bad"):""});
  for(let i=w.length;i<cur.length;i++){const s=document.createElement("span");s.className="x bad";s.textContent=cur[i];el.appendChild(s)}
  moveCaret();
}
function moveCaret(){
  const el=els[wi],k=el.children,lh=LH();
  let x;
  if(cur.length<k.length)x=k[cur.length].offsetLeft;
  else{const t=k[k.length-1];x=t.offsetLeft+t.offsetWidth}
  caret.style.left=(x-1)+"px";
  caret.style.top=(el.offsetTop+(lh-34)/2)+"px";
  const row=Math.round(el.offsetTop/lh);
  wordsEl.style.transform=`translateY(-${Math.max(0,row-1)*lh}px)`;
}
function reset(){
  clearInterval(timer);started=false;done=false;left=dur;
  words=[];els=[];wi=0;cur="";doneChars=0;totalKeys=0;goodKeys=0;okWords=0;
  [...wordsEl.querySelectorAll(".word")].forEach(n=>n.remove());
  wordsEl.style.transform="";addWords(80);paint();
  $("time").textContent=dur;$("wpm").textContent=0;$("acc").textContent="100%";
  $("res").style.display="none";
  ["modes","hud","stage","foot"].forEach(i=>$(i).style.display="");
  stage.classList.add("idle");inp.value="";
}
function focusIn(){stage.classList.remove("off");inp.focus({preventScroll:true})}
function partial(){const w=words[wi];let n=0;for(let i=0;i<cur.length&&i<w.length;i++){if(cur[i]===w[i])n++;else break}return n}
function live(){
  const mins=Math.max((dur-left),1)/60;
  $("wpm").textContent=Math.round((doneChars+partial())/5/mins);
  $("acc").textContent=(totalKeys?Math.round(goodKeys/totalKeys*100):100)+"%";
}
function start(){
  started=true;stage.classList.remove("idle");
  timer=setInterval(()=>{left--;$("time").textContent=left;live();if(left<=0)finish()},1000);
}
function finish(){
  clearInterval(timer);done=true;
  const wpm=Math.round(doneChars/5/(dur/60)),acc=totalKeys?Math.round(goodKeys/totalKeys*100):100;
  const prev=getBest(),rec=wpm>prev&&wpm>0;
  if(rec){try{localStorage.setItem(bkey(),wpm)}catch(e){}}
  $("rW").textContent=wpm;$("rA").textContent=acc+"%";$("rC").textContent=okWords;$("rB").textContent=Math.max(wpm,prev);
  $("rN").textContent=rec?"🏆 New personal best for this mode!":dur+"s mode";
  ["modes","hud","stage","foot"].forEach(i=>$(i).style.display="none");
  $("res").style.display="block";
}
function press(ch){
  if(done)return;
  if(!started)start();
  const w=words[wi];
  if(ch===" "){
    if(!cur)return;
    totalKeys++;
    if(cur===w){goodKeys++;doneChars+=w.length+1;okWords++}else els[wi].classList.add("wrong");
    wi++;cur="";
    if(wi>words.length-40)addWords(40);
    paint();live();return;
  }
  if(cur.length>=w.length+6)return;
  totalKeys++;
  if(cur.length<w.length&&ch===w[cur.length])goodKeys++;
  cur+=ch;paint();
}
inp.addEventListener("input",()=>{const v=inp.value;inp.value="";for(const ch of v)press(ch)});
inp.addEventListener("keydown",e=>{
  if(e.key==="Backspace"){e.preventDefault();if(done)return;cur=(e.ctrlKey||e.altKey)?"":cur.slice(0,-1);paint()}
  else if(e.key==="Tab"||e.key==="Escape"){e.preventDefault();reset();focusIn()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Tab"||e.key==="Escape"){e.preventDefault();reset();focusIn();return}
  if(document.activeElement!==inp&&!done&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.length===1)focusIn();
});
stage.addEventListener("click",focusIn);
inp.addEventListener("blur",()=>{if(!done)stage.classList.add("off")});
$("again").onclick=()=>{reset();focusIn()};
$("rs").onclick=()=>{reset();focusIn()};
$("modes").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",x===b));
  dur=+b.dataset.t;reset();focusIn();
});
window.addEventListener("resize",()=>{if(els[wi])moveCaret()});
reset();
</script>
</body>
</html>
