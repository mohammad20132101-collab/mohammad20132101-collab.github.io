<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Rift Hub Admin</title>
<style>
:root{--bg:#0f0f1a;--panel:#1a1a2e;--menu:#141428;--blue:#4c6fff;--purple:#9b5cff;--text:#fff;--muted:#94a3b8;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--menu);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:18px;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px}
input{flex:1;min-width:200px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;color:#fff;background:var(--blue);font-family:inherit;text-decoration:none}
.btn.alt{background:transparent;border:1px solid var(--line)}
.btn.del{background:#b91c1c}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}.tab.on{color:#fff;border-color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:4px}.card span{color:var(--muted);font-size:12px}.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:14px}.gl label{display:flex;gap:8px;align-items:center;font-size:13px}.pad{padding:16px}.gl input{flex:none;min-width:0;width:auto;padding:0}.gl label{justify-content:flex-start}.ur{cursor:pointer}.row{display:grid;grid-template-columns:minmax(0,2.4fr) 70px 140px 130px 70px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.row.h{border-top:0;background:var(--menu);color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.row small{color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:760px){.row{grid-template-columns:1fr 1fr}.row.h{display:none}}
</style>
</head>
<body>
<div class="top"><h1>Rift Hub Admin</h1><span><span id="who" style="color:var(--muted);font-size:13px;margin-right:12px"></span><a class="btn alt" href="index.html">Back to hub</a></span></div>
<div class="wrap" id="app"><p class="msg">Checking access...</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, collection, query, where, orderBy, limit, updateDoc, deleteDoc, writeBatch, getCountFromServer, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyD2XQWUKM4SQO8azXkm2XwG_e9ZQWpYJi0", authDomain: "rifthub-4275a.firebaseapp.com", projectId: "rifthub-4275a",
  storageBucket: "rifthub-4275a.firebasestorage.app", messagingSenderId: "56609352786", appId: "1:56609352786:web:55dc5d3b32412bf1e3838b" });
const auth = getAuth(app), db = getFirestore(app), $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ST = { pending: "Pending", review: "Under Review", approved: "Approved", rejected: "Rejected", completed: "Completed" };
const GAMES = "snake:Snake;tetris:Tetris;pong:Pong;flappyblock:Flappy Block;2048:2048;memorymatch:Memory Match;pac-man:Pac-Man;wordle:Wordle;connectfour:Connect Four;tictactoe:Tic-Tac-Toe;rockpaperscissors:Rock, Paper, Scissors;dots&boxes:Dots & Boxes;flowfree:Flow Free;chess:Chess;snakesandladders:Portals and Rift Holes;nonogram:Nonogram;hangman:Hangman;simonsays:Simon Says;checkers:Checkers;Utictactoe:Ultimate Tic-Tac-Toe;hexes:Hexes;sudoku:Sudoku;stack:Super Stack;cookieclicker:Cookie Clicker;crossyroad:Crossy Road;holdit:Hold It!;ludo:Ludo;subway:Subway Surfers;shutit:Shut The Box;battleship:Battleship;reaction:Reaction Test;lights:Lights Out;21:21;monopoly:Monopoly;uno:Uno;monopolydeal:Monopoly Deal;carrom:Carrom;8ballpool:8 Ball Pool;scrabble:Scrabble;typetest:Typing Test".split(";").map(x => { const i = x.indexOf(":"); return [x.slice(0, i), x.slice(i + 1)]; });
const xpAt = n => 30 * (n - 1) * (n - 1), lvl = xp => { let l = 1; while (xp >= xpAt(l + 1)) l++; return l; };
let R = [], U = [], XP = {};

async function ovw() {
  const c = async q => (await getCountFromServer(q)).data().count;
  const [u, x, r, p] = await Promise.all([c(collection(db, "profiles")), c(collection(db, "xp")), c(collection(db, "gameRequests")), c(query(collection(db, "gameRequests"), where("status", "==", "pending")))]);
  $("t_o").innerHTML = `<div class="cards">${[["Users with a profile", u], ["Accounts with XP data", x], ["Game requests", r], ["Pending requests", p]].map(a => `<div class="card"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("")}</div>
  <p style="color:var(--muted);font-size:13px">Plays and daily active users come with analytics in the next stage. Profiles are created when a user next logs in, so older accounts appear gradually.</p>`;
}
function view() {
  const q = $("q").value.toLowerCase(), f = $("f").value, s = $("s").value;
  const rs = R.filter(r => (f === "all" || (r.status || "pending") === f) && (r.name || "").toLowerCase().includes(q))
    .sort((a, b) => s === "votes" ? (b.votes || 0) - (a.votes || 0) : (b.at ? b.at.toMillis() : 0) - (a.at ? a.at.toMillis() : 0));
  $("list").innerHTML = `<div class="row h"><span>Request</span><span>Votes</span><span>Status</span><span>Date</span><span></span></div>` + (rs.map(r => `
    <div class="row"><span>${esc(r.name)}<small>${esc(r.by || r.email || "unknown")}${r.note ? " · " + esc(r.note) : ""}</small></span><span>${r.votes || 0}</span>
    <select data-s="${r.id}">${Object.entries(ST).map(([k, v]) => `<option value="${k}"${(r.status || "pending") === k ? " selected" : ""}>${v}</option>`).join("")}</select>
    <span>${r.at ? r.at.toDate().toLocaleDateString() : ""}</span><button class="btn del" data-d="${r.id}">Delete</button></div>`).join("") || `<p class="msg">No requests found.</p>`);
}
async function loadR() { const s = await getDocs(query(collection(db, "gameRequests"), orderBy("at", "desc"), limit(300))); R = s.docs.map(d => ({ id: d.id, ...d.data() })); view(); }
async function games() {
  const c = (await getDoc(doc(db, "config", "site"))).data() || {}, off = new Set(c.disabled || []);
  $("t_g").innerHTML = `<div class="bar"><select id="gotd"><option value="">Game of the Day: automatic</option>${GAMES.map(g => `<option value="${esc(g[0])}"${c.gotd === g[0] ? " selected" : ""}>${esc(g[1])}</option>`).join("")}</select><select id="season"><option value="">Season: none</option>${[["halloween","Halloween"],["winter","Winter"],["christmas","Christmas"],["newyear","New Year"],["valentine","Valentine's"],["spring","Spring"],["summer","Summer"]].map(([k, n]) => `<option value="${k}"${c.season === k ? " selected" : ""}>${n} event</option>`).join("")}</select><input id="note" maxlength="140" placeholder="Announcement shown on the hub (optional)" value="${esc(c.note || "")}"><button class="btn" id="gsave">Save</button></div>
  <div class="panel"><div class="gl">${GAMES.map(g => `<label><input type="checkbox" data-g="${esc(g[0])}"${off.has(g[0]) ? "" : " checked"}>${esc(g[1])}</label>`).join("")}</div></div><p style="color:var(--muted);font-size:13px">Unchecked games are hidden from the hub. Game files are never deleted.</p>`;
  $("gsave").onclick = async () => {
    const disabled = [...document.querySelectorAll("[data-g]")].filter(i => !i.checked).map(i => i.dataset.g);
    try { await setDoc(doc(db, "config", "site"), { disabled, gotd: $("gotd").value, season: $("season").value, note: $("note").value.trim(), updated: serverTimestamp() }); alert("Saved"); } catch (e) { console.error(e); alert("Couldn't save."); }
  };
}
const bars = (arr, h = 70) => { const m = Math.max(1, ...arr), w = 100 / arr.length; return `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${arr.map((v, i) => `<rect x="${i * w + w * .1}" y="${h - v / m * h}" width="${w * .8}" height="${Math.max(v / m * h, v ? 1 : 0)}" fill="#4c6fff"/>`).join("")}</svg>`; };
async function ana() {
  const day = Math.floor(Date.now() / 864e5), d0 = day - 29, days = Array.from({ length: 30 }, (_, i) => d0 + i);
  const [s, a, p] = await Promise.all([getDocs(query(collection(db, "stats"), where("day", ">=", d0))), getDocs(query(collection(db, "active"), where("day", ">=", d0))), getDocs(query(collection(db, "profiles"), limit(300)))]);
  const perDay = Object.fromEntries(days.map(d => [d, 0])), perGame = {}, gd = {}, dau = Object.fromEntries(days.map(d => [d, new Set()]));
  s.docs.forEach(x => { const r = x.data(); if (r.day in perDay) perDay[r.day] += r.n; perGame[r.g] = (perGame[r.g] || 0) + r.n; (gd[r.g] = gd[r.g] || {})[r.day] = r.n; });
  a.docs.forEach(x => { const r = x.data(); if (dau[r.day]) dau[r.day].add(r.uid); });
  const wau = new Set(); days.slice(-7).forEach(d => dau[d].forEach(u => wau.add(u)));
  const nm = Object.fromEntries(GAMES), top = Object.entries(perGame).sort((x, y) => y[1] - x[1]).slice(0, 5);
  const jd = p.docs.map(d => Math.floor(new Date(d.data().joined).getTime() / 864e5)).filter(n => n > 0), plays = Object.values(perDay).reduce((x, y) => x + y, 0);
  const box = (t, inner) => `<div class="card" style="margin-bottom:12px"><span>${t}</span>${inner}</div>`;
  $("t_a").innerHTML = `<div class="cards">${[["Plays (30 days)", plays], ["Active today", dau[day].size], ["Active last 7 days", wau.size]].map(c => `<div class="card"><span>${c[0]}</span><b>${c[1]}</b></div>`).join("")}</div>
  ${box("Plays per day (30 days)", bars(days.map(d => perDay[d])))}${box("Daily active users", bars(days.map(d => dau[d].size)))}${box("User growth (profiles created)", bars(days.map(d => jd.filter(j => j <= d).length)))}
  ${box("Top games, 30-day trend", top.map(([g, n]) => `<div style="display:grid;grid-template-columns:1fr 3fr 50px;gap:12px;align-items:center;margin-top:10px;font-size:13px"><span>${esc(nm[g] || g)}</span>${bars(days.map(d => (gd[g] || {})[d] || 0), 28)}<b>${n}</b></div>`).join("") || `<p class="msg">No plays recorded yet.</p>`)}
  <p style="color:var(--muted);font-size:13px">Only recorded data is shown. Tracking starts when this version goes live, so earlier days stay empty.</p>`;
}
function vu() {
  const q = $("uq").value.toLowerCase();
  $("ul").innerHTML = `<div class="row h" style="grid-template-columns:2fr 1fr 1fr 1fr"><span>User</span><span>Level</span><span>Total XP</span><span>Available</span></div>` + (U.filter(u => ((u.name || "") + (u.email || "")).toLowerCase().includes(q)).map(u => { const x = XP[u.id] || {}; return `<div class="row ur" data-u="${u.id}" style="grid-template-columns:2fr 1fr 1fr 1fr"><span>${esc(u.name)}<small>${esc(u.email)}</small></span><span>${lvl(x.lifetime || 0)}</span><span>${x.lifetime || 0}</span><span>${(x.lifetime || 0) - (x.spent || 0)}</span></div>`; }).join("") || `<p class="msg">No users found.</p>`);
}
async function users() {
  const [p, x] = await Promise.all([getDocs(query(collection(db, "profiles"), limit(300))), getDocs(query(collection(db, "xp"), limit(300)))]);
  U = p.docs.map(d => ({ id: d.id, ...d.data() })); XP = Object.fromEntries(x.docs.map(d => [d.id, d.data()]));
  $("t_u").innerHTML = `<div class="bar"><input id="uq" placeholder="Search by username or email..."></div><div class="panel" id="ul"></div><div class="panel pad" id="ud" style="display:none;margin-top:16px"></div>`;
  $("uq").oninput = vu; vu();
}
async function detail(id) {
  const u = U.find(a => a.id === id), x = XP[id] || { lifetime: 0, spent: 0 }; let tiers = "n/a";
  try { const d = await getDoc(doc(db, "users", id)); if (d.exists()) tiers = Object.values((JSON.parse(JSON.parse(d.data().data).riftAch2 || "{}").seen) || {}).reduce((a, b) => a + b, 0); } catch (e) {}
  const el = $("ud"); el.style.display = "block";
  el.innerHTML = `<b>${esc(u.name)}</b> · ${esc(u.email)}<p style="color:var(--muted);font-size:13px">Joined ${esc(u.joined || "unknown")} · Level ${lvl(x.lifetime)} · Total XP ${x.lifetime} · Spent ${x.spent} · Available ${x.lifetime - x.spent} · Achievement tiers ${tiers}</p>
  <div class="bar"><input id="amt" type="number" placeholder="XP change, e.g. 100 or -50" style="max-width:220px"><input id="why" maxlength="40" placeholder="Reason (recorded in history)"><button class="btn" id="adj">Apply</button></div>`;
  $("adj").onclick = async () => {
    const amt = parseInt($("amt").value), why = $("why").value.trim(), nl = x.lifetime + amt;
    if (!amt || !why) { alert("Enter an amount and a reason."); return; }
    if (nl < Math.max(x.spent, x.synced || 0)) { alert("That would drop XP below what the user has spent or synced."); return; }
    try {
      const b = writeBatch(db); b.update(doc(db, "xp", id), { lifetime: nl });
      b.set(doc(db, "xp", id, "ledger", "adm_" + x.lifetime + "_" + nl), { type: "admin", amount: amt, reason: "Admin: " + why, by: auth.currentUser.uid, at: serverTimestamp() });
      await b.commit(); x.lifetime = nl; XP[id] = x; vu(); detail(id);
    } catch (e) { console.error(e); alert("Couldn't apply. Check your rules."); }
  };
}
document.addEventListener("change", async e => {
  const t = e.target.closest("[data-s]"); if (!t) return;
  try { await updateDoc(doc(db, "gameRequests", t.dataset.s), { status: t.value }); R.find(r => r.id === t.dataset.s).status = t.value; }
  catch (er) { console.error(er); alert("Couldn't update."); loadR(); }
});
document.addEventListener("click", async e => {
  const d = e.target.closest("[data-d]");
  if (d && confirm("Delete this request?")) { try { await deleteDoc(doc(db, "gameRequests", d.dataset.d)); R = R.filter(r => r.id !== d.dataset.d); view(); } catch (er) { alert("Couldn't delete."); } return; }
  const u = e.target.closest("[data-u]"); if (u) { detail(u.dataset.u); return; }
  const t = e.target.closest("[data-t]"); if (!t) return;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === t));
  ["o", "a", "r", "g", "u"].forEach(k => $("t_" + k).style.display = k === t.dataset.t ? "" : "none");
  try { if (t.dataset.t === "o") await ovw(); if (t.dataset.t === "r") await loadR(); if (t.dataset.t === "a") await ana(); if (t.dataset.t === "g") await games(); if (t.dataset.t === "u") await users(); } catch (er) { console.error(er); }
});
onAuthStateChanged(auth, async u => {
  if (!u) { $("app").innerHTML = `<p class="msg">Log in on the hub first, then reopen this page.</p>`; return; }
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!ok) { $("app").innerHTML = `<p class="msg">Access denied.</p>`; return; }
  $("who").textContent = u.email;
  $("app").innerHTML = `<div class="tabs">${[["o", "Overview"], ["a", "Analytics"], ["r", "Requests"], ["g", "Games"], ["u", "Users"]].map(t => `<button class="tab${t[0] === "o" ? " on" : ""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div id="t_o"></div><div id="t_r" style="display:none"><div class="bar"><input id="q" placeholder="Search requests..."><select id="f"><option value="all">All statuses</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><select id="s"><option value="votes">Most votes</option><option value="date">Newest</option></select></div><div class="panel" id="list"></div></div><div id="t_a" style="display:none"></div><div id="t_g" style="display:none"></div><div id="t_u" style="display:none"></div>`;
  ["q", "f", "s"].forEach(i => $(i).addEventListener("input", view));
  try { await ovw(); } catch (e) { console.error(e); $("t_o").innerHTML = `<p class="msg">Couldn't load. Check your rules.</p>`; }
});
</script>
</body>
</html>
